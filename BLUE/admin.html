<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sea Gull - Admin Menu Portal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--color-bg-light); color: var(--color-text-dark); padding: 40px; font-family: var(--font-sans); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--color-accent); padding-bottom: 20px; margin-bottom: 40px; }
        .editor-section { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .category-group { margin-bottom: 40px; border-left: 3px solid var(--color-accent); padding-left: 20px; }
        
        .item-row { 
            display: grid; 
            grid-template-columns: 2fr 2fr 3fr 3fr 1fr; 
            gap: 15px; 
            margin-bottom: 15px; 
            align-items: start; 
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }
        .header-row { font-weight: bold; background: none; padding-bottom: 0; margin-bottom: 10px; align-items: end;}
        
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 0.9rem; }
        textarea { resize: vertical; min-height: 40px; }
        
        .btn-save { background: var(--color-accent); color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        .btn-save:hover { opacity: 0.9; }
        .btn-reset { background: #d9534f; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.3s;}
        .btn-reset:hover { opacity: 0.9; }
        
        .admin-auth-overlay { position: fixed; inset: 0; background: var(--color-bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: white; padding: 40px; border-radius: 8px; text-align: center; max-width: 400px; width: 100%; }
        .auth-box input { margin: 20px 0; padding: 15px; width: 100%; text-align: center; border: 1px solid #ccc; font-size: 1.1rem; }
        
        h2.branch-title { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--color-bg-dark); }
        h4.cat-title { color: var(--color-accent); margin-bottom: 15px; font-size: 1.2rem; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #4CAF50; color: white; padding: 15px 25px; border-radius: 4px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;}
    </style>
</head>
<body>
    <div id="auth-overlay" class="admin-auth-overlay">
        <div class="auth-box">
            <img src="https://i.ibb.co/3sX8Mdf/seagull-logo-gold.png" alt="Sea Gull" style="height:60px; margin-bottom:20px; filter: brightness(0) saturate(100%);">
            <h2>Admin Portal</h2>
            <input type="password" id="auth-pass" placeholder="Enter Password">
            <button class="btn-save" id="login-btn" style="width: 100%;">Login</button>
            <p id="auth-error" style="color:red; display:none; margin-top:15px;">Incorrect Password</p>
        </div>
    </div>

    <div class="admin-header">
        <div>
            <img src="https://i.ibb.co/3sX8Mdf/seagull-logo-gold.png" alt="Sea Gull" style="height:40px; filter: brightness(0) saturate(100%); display:block; margin-bottom: 5px;">
            <strong style="color: var(--color-accent); letter-spacing: 1px;">MENU EDITOR</strong>
        </div>
        <div>
            <a href="index.html" style="margin-right: 20px; color: var(--color-accent); text-decoration: none; font-weight: bold;">← Back to Site</a>
            <button class="btn-reset" id="reset-btn">Reset to Default</button>
            <button class="btn-save" id="save-btn">Save Changes</button>
        </div>
    </div>

    <style>
        .branch-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .branch-tab { background: #eee; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: var(--color-bg-dark); }
        .branch-tab.active { background: var(--color-accent); color: white; }
    </style>
    <div id="branch-selector" class="branch-tabs"></div>

    <div id="admin-editor"></div>
    
    <div id="toast" class="toast">Changes saved successfully!</div>

    <script type="module" src="admin.js"></script>
</body>
</html>
